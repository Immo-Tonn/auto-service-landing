services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # target указывает, какую стадию из Dockerfile использовать.
      # Для разработки берём стадию "dev" — она лёгкая и поддерживает hot reload.
      # Для продакшна смени на: target: prod
      target: dev

    # command: npx next dev --turbo --port 3000

    container_name: auto-service-landing

    ports:
      - "3000:3000"

    volumes:
      # Монтируем весь проект с твоего компьютера внутрь контейнера.
      # Синтаксис: ПАПКА_НА_ХОСТЕ:ПАПКА_В_КОНТЕЙНЕРЕ
      # "." — текущая папка (корень проекта)
      # Когда ты меняешь файл в редакторе — изменение сразу видно в контейнере,
      # Next.js замечает его и перезагружает страницу. Это и есть hot reload.
      - .:/app

      # Анонимный volume для node_modules — защита от конфликта.
      # Проблема без него: монтирование ".:/app" перекрывает ВСЁ в /app,
      # включая node_modules, которые npm ci установил внутри контейнера.
      # Решение: этот volume "закрывает" папку /app/node_modules от перезаписи,
      # сохраняя внутри именно те модули, что установлены в контейнере.
      - /app/node_modules
      # - /app/.next

    environment:
      - NODE_ENV=development

      # WATCHPACK_POLLING — критически важно для Windows.
      # На Windows файловые события (уведомления об изменении файлов) не передаются
      # в Docker-контейнер через стандартный механизм inotify.
      # Без этой настройки Next.js просто не увидит, что файл изменился,
      # и hot reload работать не будет.
      # Polling = "проверяй каждые N миллисекунд, не изменился ли файл".
      - WATCHPACK_POLLING=true

    # env_file: .env  # <-- раскомментируй, когда появятся секреты в .env файле

    # unless-stopped: перезапускать контейнер автоматически при любых сбоях,
    # кроме случая когда ты сам его остановил командой docker compose down.
    restart: unless-stopped
